# star.haruyuki.cn：游戏静态站、WebSocket 与最小统一身份代理示例。
# 统一身份响应在本域设置 __Host-haruhi_game_* Cookie，不使用父域 Cookie。

server {
    listen 80;
    listen [::]:80;
    server_name star.haruyuki.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/haruhi-game; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name star.haruyuki.cn;

    ssl_certificate     /etc/letsencrypt/live/star.haruyuki.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star.haruyuki.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 只暴露游戏所需的认证边界；Host 保持 star.haruyuki.cn，确保 Cookie 为本域 host-only。
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:17777;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/game/ {
        proxy_pass http://127.0.0.1:17777;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /uploads/avatars/ {
        proxy_pass http://127.0.0.1:17777;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:21246/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    root /var/www/haruhi-game/dist;
    location / { try_files $uri $uri/ /index.html; }
}
