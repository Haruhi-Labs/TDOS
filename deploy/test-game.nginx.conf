# 放进 haruyuki.cn 现有 HTTPS server 块，替换旧 /test-game/ location。
# 不改主站身份接口；测试构建不请求这些接口。两个上游均为独立测试进程。
location = /test-game { return 301 /test-game/; }
location ^~ /test-game/ws/ {
    proxy_pass http://127.0.0.1:21256/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_read_timeout 75s;
}
location ^~ /test-game/ {
    proxy_pass http://127.0.0.1:21255/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
}
